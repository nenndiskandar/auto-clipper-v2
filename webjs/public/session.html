<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Clipper</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#facc15">
<script src="/pwa.js"></script>
<script src="/templates.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        accent: '#facc15',
        surface: { 0: '#09090b', 1: '#121215', 2: '#18181b', 3: '#27272a' },
        zinc: { 450: '#8b8b96', 650: '#43434c' }
      }
    }
  }
}
</script>
<style>
body { background: #09090b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
pre.log { background: #000; color: #a1a1aa; font-size: .75rem; max-height: 40vh; overflow-y: auto; white-space: pre-wrap; border-radius: .5rem; }
.tpl-btn { padding: .25rem .5rem; border-radius: .375rem; border: 1px solid #3f3f46; background: #18181b; font-size: .75rem; transition: all .15s; }
.tpl-btn:hover { border-color: #facc15; color: #fff; }
</style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#09090b]">

<!-- SIDEBAR -->
<aside class="w-full md:w-60 border-b md:border-b-0 md:border-r border-zinc-800 bg-zinc-950 flex flex-col shrink-0">
  <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
    <span class="font-bold text-sm tracking-wider text-accent">⚡ YT CLIPPER</span>
    <a href="/logout" class="text-xs text-zinc-400 hover:text-white transition md:hidden">Logout</a>
  </div>
  <div class="p-3 flex flex-row md:flex-col gap-1 overflow-x-auto md:overflow-x-visible">
    <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition bg-zinc-900 text-white font-medium">🏠 Library</a>
    <a href="/create.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">＋ Create Clip</a>
    <a href="/tasks.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">📋 Tasks</a>
    <a href="/story.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">🎬 Story</a>
    <a href="/facebook.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">📘 FB</a>
    <a href="/cookies.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">🍪 Cookies</a>
    <a href="/settings.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">⚙️ Settings</a>
  </div>
  <div class="mt-auto p-4 border-t border-zinc-800 hidden md:flex items-center justify-between text-[11px]">
    <span class="text-zinc-500 truncate max-w-[120px]" id="whoami"></span>
    <a href="/logout" class="text-zinc-400 hover:text-white transition">Logout</a>
  </div>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
  <!-- MAIN CONTENT -->
  <main class="max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6 flex-1">
    <div class="text-center text-zinc-500 py-12 text-sm" id="loadingState">Memuat detail sesi…</div>
    
    <div id="contentState" class="hidden space-y-6">
      
      <!-- INFO SESI -->
      <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 md:p-5 shadow-sm space-y-3">
        <div class="flex flex-wrap justify-between items-start gap-2">
          <div>
            <h1 class="text-base md:text-lg font-bold text-white" id="s_title">-</h1>
            <p class="text-xs text-zinc-400 mt-0.5" id="s_meta">-</p>
          </div>
          <span class="bg-zinc-800 text-zinc-300 text-xs px-2.5 py-1 rounded font-mono" id="s_id"></span>
        </div>
        <div id="sourceBox" class="text-xs bg-surface-2 border border-zinc-800 rounded-lg p-3 hidden">
          <span class="font-medium text-zinc-500 mr-2">Sumber Video:</span>
          <a id="s_url" class="text-accent hover:underline break-all font-mono" target="_blank" rel="noopener" href="#"></a>
        </div>
      </div>

      <!-- DAFTAR KLIP HASIL RENDER -->
      <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 md:p-5 shadow-sm space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-2 pb-3 border-b border-zinc-800">
          <h2 class="text-sm font-semibold text-white flex items-center gap-2">
            <span>🎞️ Klip Hasil Render</span>
            <span class="text-xs text-zinc-500 font-normal" id="clipCountInfo"></span>
          </h2>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3" id="clipsGrid"></div>
      </div>

      <!-- RENDER ULANG -->
      <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 md:p-5 shadow-sm flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-white">🔁 Render Ulang</h2>
          <p class="text-[11px] text-zinc-400">Buka Create untuk pilih momen & render ulang</p>
        </div>
        <button onclick="goCreate()" class="px-4 py-2 text-xs font-semibold bg-accent text-black rounded-lg hover:bg-yellow-400 transition">🎬 Render Ulang → Create</button>
      </div>

    </div>
  </main>
</div>

<script>
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});

const params = new URLSearchParams(window.location.search);
const sid = params.get('id');

const TEMPLATES = window.UNIFIED_TEMPLATES || {};

let HIGHLIGHTS = [];
let ACTIVE_TPL = null;

function esc(s) { return (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadSession() {
  if (!sid) {
    document.getElementById('loadingState').textContent = 'ID Sesi tidak ditemukan di URL.';
    return;
  }
  try {
    const rHls = await fetch(`/api/highlights/${encodeURIComponent(sid)}`);
    HIGHLIGHTS = await rHls.json().catch(() => []);

    const rSess = await fetch('/api/sessions');
    const sessions = await rSess.json();
    const s = sessions.find(x => x.id === sid);

    document.getElementById('s_title').textContent = s ? s.title : sid;
    document.getElementById('s_meta').textContent = `${s && s.channel ? s.channel + ' · ' : ''}${s ? new Date(s.created).toLocaleString('id-ID') : ''} · ${s ? s.total : 0} klip tersimpan`;
    document.getElementById('s_id').textContent = sid;

    if (s && s.url) {
      document.getElementById('sourceBox').classList.remove('hidden');
      const uEl = document.getElementById('s_url');
      uEl.href = s.url;
      uEl.textContent = s.url;
    }

    const hlEl=document.getElementById('hlListContainer'); if(hlEl) renderHighlights();
    const tb=document.getElementById('tplBar'); if(tb) initTemplateBar();
    
    // Jika clip 0 → langsung arahkan ke create untuk render (opusclip-like)
    if (!s || !s.clips || s.clips.length === 0) {
      location.replace('/create.html?session=' + encodeURIComponent(sid));
      return;
    }
    // Tampilkan klip hasil render
    if (s && s.clips) renderClips(s.clips);

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('contentState').classList.remove('hidden');
  } catch (e) {
    document.getElementById('loadingState').textContent = 'Gagal memuat sesi: ' + e;
  }
}

function fmtSize(b) {
  if (!b) return '-';
  if (b >= 1024 * 1024) return (b / 1048576).toFixed(1) + ' MB';
  return Math.round(b / 1024) + ' KB';
}

function fmtDur(s) {
  if (!s && s !== 0) return '';
  s = Math.round(Number(s));
  if (s < 60) return s + 's';
  return Math.floor(s / 60) + 'm' + (s % 60 ? s % 60 + 's' : '');
}

function renderClips(clips) {
  const container = document.getElementById('clipsGrid');
  if (!clips || !clips.length) {
    container.innerHTML = '<div class="col-span-full p-4 text-xs text-zinc-500 text-center">Belum ada klip yang dirender.</div>';
    document.getElementById('clipCountInfo').textContent = '(0 klip)';
    return;
  }
  document.getElementById('clipCountInfo').textContent = `(${clips.length} klip)`;
  container.innerHTML = clips.map((c, ci) => {
    const dl = `/download/${encodeURIComponent(sid)}/${encodeURIComponent(c.dir)}/${encodeURIComponent(c.file)}`;
    const detailUrl = `/detail.html?session=${encodeURIComponent(sid)}&clip=${encodeURIComponent(c.dir)}`;
    const tags = [
      c.hook ? '<span class="text-[9px] px-1 bg-red-500/10 text-amber-400 border border-amber-500/20 rounded">thumbnail</span>' : '',
      c.captions ? '<span class="text-[9px] px-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded">caption</span>' : '',
      c.watermark ? '<span class="text-[9px] px-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 rounded">watermark</span>' : '',
      c.credit ? '<span class="text-[9px] px-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded">credit</span>' : '',
      c.has_bgm ? '<span class="text-[9px] px-1 bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20 rounded">🎵 bgm</span>' : '',
      c.hook_v2 ? '<span class="text-[9px] px-1 bg-violet-500/10 text-violet-400 border border-violet-500/20 rounded">⚡ hook-v2</span>' : '',
      c.akun_tujuan ? `<span class="text-[9px] px-1 bg-orange-500/10 text-orange-400 border border-orange-500/20 rounded" title="Tipe: ${esc(c.tipe_akun||'')}">👤 ${esc(c.akun_tujuan)}</span>` : '',
      c.thumbnail ? `<a class="text-[9px] px-1 bg-teal-500/10 text-teal-400 border border-teal-500/20 rounded hover:underline" target="_blank" href="/thumb/${encodeURIComponent(sid)}/${encodeURIComponent(c.dir)}/thumbnail.jpg">🖼 thumb</a>` : '',
    ].join(' ');
    
    return `
    <div class="group bg-surface-2 border border-zinc-800 rounded-lg overflow-hidden flex flex-col hover:border-zinc-700 transition">
      <a class="relative aspect-video bg-zinc-950 block overflow-hidden" href="${detailUrl}">
        <img class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" alt="${esc(c.title)}"
             src="/thumb/${encodeURIComponent(sid)}/${encodeURIComponent(c.dir)}">
        ${c.score != null ? `<span class="absolute top-1.5 right-1.5 px-1 py-0.5 text-[9px] font-bold bg-amber-400 text-black rounded shadow">⭐ ${c.score}</span>` : ''}
        ${c.duration ? `<span class="absolute top-1.5 left-1.5 px-1 py-0.5 text-[9px] font-bold bg-blue-600 text-white rounded shadow font-mono">⏱️ ${fmtDur(c.duration)}</span>` : ''}
      </a>
      <div class="p-2 flex flex-col flex-1">
        <a href="${detailUrl}" class="text-[11px] font-bold text-white line-clamp-2 mb-1 hover:text-accent transition" title="${esc(c.title)}">${esc(c.title)}</a>
        ${c.hook_text ? `<p class="text-[10px] text-zinc-300 line-clamp-1 mb-0.5">🎯 ${esc(c.hook_text)}</p>` : ''}
        <p class="text-[10px] text-zinc-500 line-clamp-1 mb-1.5">${esc(c.desc)}</p>
        
        <div class="text-[9px] text-zinc-500 mb-2 flex items-center justify-between mt-auto">
          <span>💾 ${fmtSize(c.size_bytes)}</span>
          <span>${c.created ? new Date(c.created).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-'}</span>
        </div>
        <div class="flex flex-wrap gap-1 mb-3">${tags}</div>
        
        <div class="grid grid-cols-2 gap-1 mt-auto">
          <a class="flex items-center justify-center py-1.5 text-xs font-semibold bg-zinc-800 text-zinc-200 hover:text-white rounded border border-zinc-700 hover:bg-zinc-700 transition" href="${dl}" download title="Download">⬇ Download</a>
          <button class="flex items-center justify-center py-1.5 text-xs font-semibold bg-red-950/20 text-red-400 hover:text-red-300 rounded border border-red-900/30 hover:bg-red-900/20 transition" onclick="deleteClip('${esc(c.dir)}', '${esc(c.title)}', this)" title="Hapus">🗑 Hapus</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function deleteClip(clipDir, title, btn) {
  if (!confirm(`Hapus klip "${title || clipDir}"?\nFolder beserta semua file varian ikut terhapus.`)) return;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await fetch(`/api/delete/${encodeURIComponent(sid)}/${encodeURIComponent(clipDir)}`, { method: 'POST' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await loadSession();
  } catch (e) {
    alert('Gagal hapus klip: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🗑 Hapus';
  }
}

function renderHighlights() {
  const container = document.getElementById('hlListContainer');
  if(!container) return;
  if (!Array.isArray(HIGHLIGHTS) || !HIGHLIGHTS.length) {
    container.innerHTML = '<div class="p-4 text-xs text-zinc-500 text-center">Belum ada highlight. Silakan klik Cari Ulang Highlight di bawah.</div>';
    const a=document.getElementById('hlCountInfo'); if(a) a.textContent = '(0 momen)';
    updateCount();
    return;
  }
  const b=document.getElementById('hlCountInfo'); if(b) b.textContent = `(${HIGHLIGHTS.length} momen siap)`;
  container.innerHTML = HIGHLIGHTS.map(h => `
    <label class="flex items-start gap-3 p-3 hover:bg-zinc-800/40 transition cursor-pointer">
      <input class="rg-check mt-1 flex-shrink-0 w-4 h-4 accent-[#facc15]" type="checkbox" value="${h.i}" onchange="updateCount()">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="font-semibold text-xs text-white truncate">${esc(h.title)}</span>
          ${h.score != null ? `<span class="px-1.5 py-0.5 text-[9px] font-bold ${h.score >= 80 ? 'bg-amber-400 text-black' : 'bg-zinc-800 text-zinc-300 border border-zinc-700'} rounded">🔥 ${h.score}/100</span>` : ''}
        </div>
        <span class="text-[11px] text-zinc-400 mt-0.5 block">${esc(h.start)} → ${esc(h.end)} · ${h.duration}s</span>
        ${h.hook_text ? `<p class="text-[10px] text-zinc-300 font-medium mt-0.5">🎯 ${esc(h.hook_text)}</p>` : ''}
        ${h.reason ? `<p class="text-[10px] text-zinc-500 italic mt-0.5">💡 ${esc(h.reason)}</p>` : ''}
      </div>
    </label>
  `).join('');
  updateCount();
}

function initTemplateBar() {
  const bar = document.getElementById('tplBar'); if(!bar) return;
  bar.innerHTML = Object.entries(TEMPLATES).map(([k, t]) =>
    `<button class="tpl-btn text-zinc-300 hover:text-white" title="${String(t.desc||'').replace(/"/g,'&quot;')}" onclick="applyTemplate('${k}')">${t.label}</button>`).join('');
}

async function applyTemplate(key) {
  const t = TEMPLATES[key];
  if (!t) return;
  ACTIVE_TPL = { ...t.cfg };
  const m = document.getElementById('tplMsg');
  m.classList.remove('hidden', 'text-emerald-400', 'text-red-400');
  m.classList.add('text-amber-400');
  m.textContent = `⏳ Menyimpan setting template ${t.label}…`;
  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ACTIVE_TPL)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    m.classList.remove('text-amber-400');
    m.classList.add('text-emerald-400');
    m.textContent = `✅ Template ${t.label} aktif & tersimpan otomatis.`;
    setTimeout(() => m.classList.add('hidden'), 4000);
  } catch (e) {
    m.classList.remove('text-amber-400');
    m.classList.add('text-red-400');
    m.textContent = `❌ Gagal menyimpan template (${e.message || e}).`;
  }
}

function toggleAllCheck() {
  const boxes = [...document.querySelectorAll('.rg-check')];
  const anyOff = boxes.some(x => !x.checked);
  boxes.forEach(x => x.checked = anyOff);
  updateCount();
}

function updateCount() {
  const all = document.querySelectorAll('.rg-check');
  const el=document.getElementById('selCount'); if(!el) return;
  const sel = [...all].filter(x => x.checked).length;
  el.textContent = `🎬 ${sel} / ${all.length} klip dipilih`;
}

async function doRefind() {
  const countEl = document.getElementById('refindCount');
  const num_clips = countEl ? (countEl.value || 'auto') : 'auto';
  const st = document.getElementById('actionStatus');
  const logBox = document.getElementById('actionLog');
  logBox.classList.remove('hidden');
  st.innerHTML = `<div class="p-3 text-xs bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300">⏳ AI sedang menganalisis transkrip & mencari ${num_clips} highlight baru…</div>`;
  try {
    const r = await fetch(`/api/refind/${encodeURIComponent(sid)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ num_clips })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) {
    st.innerHTML = `<div class="p-3 text-xs bg-red-950/20 border border-red-900/30 text-red-400 rounded-lg">❌ ${esc(String(e))}</div>`;
    return;
  }

  pollJob(`/api/refind/status/${encodeURIComponent(sid)}`, logBox, async j => {
    if (j.code === 0 && j.result && j.result.ok) {
      st.innerHTML = `<div class="p-3 text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-lg">✅ ${j.result.count} momen baru berhasil ditemukan! Memuat ulang…</div>`;
      setTimeout(async () => {
        const rHls = await fetch(`/api/highlights/${encodeURIComponent(sid)}`);
        HIGHLIGHTS = await rHls.json().catch(() => []);
        renderHighlights();
      }, 1000);
    } else {
      st.innerHTML = `<div class="p-3 text-xs bg-red-950/20 border border-red-900/30 text-red-400 rounded-lg">❌ Gagal mencari highlight — lihat log.</div>`;
    }
  });
}

async function startProcess() {
  const sel = [...document.querySelectorAll('.rg-check:checked')].map(b => parseInt(b.value));
  if (!sel.length) {
    alert('Pilih minimal 1 momen highlight terlebih dahulu.');
    return;
  }
  let base = ACTIVE_TPL;
  if (!base) {
    try { base = await (await fetch('/api/config')).json(); } catch { base = {}; }
  }
  const hook = base.hook !== false;
  const caps = base.captions !== false;

  const st = document.getElementById('actionStatus');
  const logBox = document.getElementById('actionLog');
  logBox.classList.remove('hidden');
  st.innerHTML = '<div class="p-3 text-xs bg-zinc-950 border border-zinc-800 text-zinc-300 rounded-lg">⏳ Mengunduh & merender klip terpilih ke format vertikal…</div>';

  try {
    const r = await fetch(`/api/process/${encodeURIComponent(sid)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selected: sel, hook, captions: caps })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) {
    st.innerHTML = `<div class="p-3 text-xs bg-red-950/20 border border-red-900/30 text-red-400 rounded-lg">❌ ${esc(String(e))}</div>`;
    return;
  }

  pollJob(`/api/process/status/${encodeURIComponent(sid)}`, logBox, j => {
    if (j.code === 0) {
      st.innerHTML = '<div class="p-3 text-xs bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-lg">✅ Render klip selesai! Hasilnya sudah masuk ke Library.</div>';
    } else {
      st.innerHTML = `<div class="p-3 text-xs bg-red-950/20 border border-red-900/30 text-red-400 rounded-lg">❌ Render gagal (exit ${j.code ?? '?'}) — cek log di bawah.</div>`;
    }
  });
}

function ensureProgressBar(logBox) {
  if (!logBox || !logBox.parentNode) return null;
  let bar = logBox.parentNode.querySelector(':scope > .live-progress');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'live-progress mt-2';
    bar.innerHTML = '<div class="h-1.5 bg-zinc-800 rounded-full overflow-hidden"><div class="h-full bg-accent transition-all duration-500" style="width:0%"></div></div><div class="text-[10px] text-zinc-400 mt-1 tabular-nums">0%</div>';
    logBox.parentNode.insertBefore(bar, logBox);
  }
  return bar;
}

function updateProgressBar(logBox, p) {
  const bar = ensureProgressBar(logBox);
  if (!bar) return;
  if (p == null) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  bar.firstElementChild.firstElementChild.style.width = Math.round(p) + '%';
  bar.lastElementChild.textContent = Math.round(p) + '%';
}

function pollJob(url, logBox, onDone) {
  const poll = setInterval(async () => {
    try {
      const j = await (await fetch(url)).json();
      if (logBox && j.log) {
        const stick = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 60;
        logBox.textContent = j.log;
        if (stick) logBox.scrollTop = logBox.scrollHeight;
      }
      updateProgressBar(logBox, j.progress);
      if (!j.running) {
        clearInterval(poll);
        updateProgressBar(logBox, null);
        onDone(j);
      }
    } catch {}
  }, 1000);
}

function goCreate(){
  // simpan sesi ke create via query
  location.href='/create.html?session='+encodeURIComponent(sid);
}
loadSession();
</script>
</body>
</html>

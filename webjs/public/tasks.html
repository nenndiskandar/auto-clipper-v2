<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — YT Short Clipper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: {
    surface: { 0:'#09090b', 1:'#18181b', 2:'#27272a', 3:'#3f3f46' },
    zinc: { 450: '#8b8b96', 650: '#43434c' },
    accent: '#facc15',
  }}}
}
</script>
<style>
body{background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
pre.log{background:#000;color:#a1a1aa;font-size:.7rem;max-height:75vh;overflow-y:auto;white-space:pre-wrap;border-radius:.5rem}
</style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#09090b]">

<!-- SIDEBAR -->
<aside class="w-full md:w-60 border-b md:border-b-0 md:border-r border-zinc-800 bg-zinc-950 flex flex-col shrink-0">
  <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
    <span class="font-bold text-sm tracking-wider text-accent">⚡ YT CLIPPER</span>
    <a href="/logout" class="text-xs text-zinc-400 hover:text-white transition md:hidden">Logout</a>
  </div>
  <div class="p-3 flex flex-row md:flex-col gap-1 overflow-x-auto md:overflow-x-visible">
    <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">🏠 Library</a>
    <a href="/create.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">＋ Create Clip</a>
    <a href="/tasks.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition bg-zinc-900 text-white font-medium">📋 Tasks</a>
    <a href="/settings.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">⚙️ Settings</a>
  </div>
  <div class="mt-auto p-4 border-t border-zinc-800 hidden md:flex items-center justify-between text-[11px]">
    <span class="text-zinc-500 truncate max-w-[120px]" id="whoami"></span>
    <a href="/logout" class="text-zinc-400 hover:text-white transition">Logout</a>
  </div>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
  <!-- MAIN CONTENT -->
  <main class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-1">
    <div class="bg-surface-1 border border-zinc-800 rounded-xl overflow-hidden shadow-lg">
      <div class="px-4 py-3 border-b border-zinc-800 flex justify-between items-center bg-surface-0/50 flex-wrap gap-2">
        <div>
          <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Daftar Job</h2>
          <p class="text-[10px] text-zinc-500">Semua job berjalan & terakhir</p>
        </div>
        <span class="text-[10px] text-zinc-500 bg-zinc-850 px-2 py-0.5 rounded border border-zinc-800">auto-refresh 1.5s</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="border-b border-zinc-800 bg-surface-2/30 text-zinc-400 text-[10px] uppercase tracking-wider">
              <th class="py-2.5 px-4 font-semibold">Job</th>
              <th class="py-2.5 px-4 font-semibold">Sesi</th>
              <th class="py-2.5 px-4 font-semibold">Status</th>
              <th class="py-2.5 px-4 font-semibold">Progress</th>
              <th class="py-2.5 px-4 font-semibold hidden md:table-cell">Durasi</th>
              <th class="py-2.5 px-4 font-semibold hidden lg:table-cell">Log</th>
              <th class="py-2.5 px-4 font-semibold text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="taskBody" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="7" class="py-6 px-4 text-center text-zinc-500">memuat…</td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div id="empty" class="text-zinc-500 text-xs text-center py-8 hidden bg-surface-2/10">
        Tidak ada job aktif atau terakhir saat ini.
      </div>
    </div>
  </main>
</div>

<!-- MODAL: LOG -->
<div id="logModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
  <div class="bg-surface-1 border border-zinc-800 rounded-xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-zinc-800 bg-surface-0/50">
      <h3 class="text-xs font-semibold text-zinc-300 uppercase tracking-wider truncate" id="logTitle">Log</h3>
      <button onclick="Modal.hide('logModal')" class="text-zinc-400 hover:text-white text-lg">✕</button>
    </div>
    <div class="p-4 overflow-y-auto flex-1 bg-black">
      <pre id="logBox" class="log font-mono">memuat…</pre>
    </div>
    <div class="flex justify-end px-4 py-2.5 border-t border-zinc-800 bg-surface-1">
      <button onclick="Modal.hide('logModal')" class="px-3 py-1 text-xs bg-zinc-800 text-zinc-300 hover:text-white border border-zinc-700 rounded transition">Tutup</button>
    </div>
  </div>
</div>

<script>
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dur = s => s == null ? '-' : (s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's');
const sessLink = sid => sid === '-' ? '<span class="text-zinc-600 font-mono">-</span>' : `<a href="/session.html?id=${encodeURIComponent(sid)}" class="text-accent hover:underline font-mono text-[11px]">${esc(sid)}</a>`;

const statusBadge = j => j.running
  ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-[10px] font-bold bg-[#7c3aed]/15 text-[#a78bfa] border border-[#7c3aed]/30 rounded-full animate-pulse">● PROCESSING</span>'
  : (j.code === 0 ? '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">● COMPLETED</span>' : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-[10px] font-bold bg-red-500/10 text-red-400 border border-red-500/20 rounded-full">● FAILED (${j.code ?? '?'})</span>`);
const progressBar = j => {
  if (j.progress == null) return '<span class="text-[11px] text-zinc-600">—</span>';
  const pct = Math.round(j.progress);
  const color = j.running ? 'from-[#7c3aed] to-[#a78bfa]' : (j.code===0 ? 'from-emerald-500 to-emerald-400' : 'from-red-500 to-red-400');
  return `<div class="w-32"><div class="h-2 bg-zinc-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r ${color} transition-all duration-700 rounded-full" style="width:${pct}%"></div></div><div class="text-[10px] font-mono font-bold mt-1 ${j.running ? 'text-[#a78bfa]' : 'text-zinc-400'} tabular-nums">${pct}%</div></div>`;
};

const Modal = {
  show(id) {
    const el = document.getElementById(id);
    el.classList.remove('hidden');
    el.classList.add('flex');
    document.body.classList.add('overflow-hidden');
  },
  hide(id) {
    const el = document.getElementById(id);
    el.classList.add('hidden');
    el.classList.remove('flex');
    document.body.classList.remove('overflow-hidden');
  }
};

// Close modal on escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') Modal.hide('logModal');
});

let JOBS = [];

async function refresh() {
  let jobs = [];
  try { jobs = await (await fetch('/api/tasks')).json(); } catch {}
  if (!Array.isArray(jobs)) jobs = [];
  JOBS = jobs;
  document.getElementById('empty').style.display = jobs.length ? 'none' : 'block';
  document.getElementById('taskBody').innerHTML = jobs.map((j, i) => `
    <tr class="group hover:bg-zinc-800/40 transition cursor-pointer ${j.running ? 'bg-[#7c3aed]/[0.06]' : ''}" onclick="openLog(${i})">
      <td class="py-3 px-4 font-bold text-[12px] tracking-tight">${j.session !== '-' ? `<a href="/session.html?id=${encodeURIComponent(j.session)}" onclick="event.stopPropagation()" class="text-white hover:text-accent hover:underline">${esc(j.type)}</a>` : `<span class="text-white">${esc(j.type)}</span>`}</td>
      <td class="py-3 px-4" onclick="event.stopPropagation()">${sessLink(j.session)}</td>
      <td class="py-3 px-4">${statusBadge(j)}</td>
      <td class="py-3 px-4">${progressBar(j)}</td>
      <td class="py-3 px-4 text-zinc-300 font-mono text-[11px] hidden md:table-cell">${dur(j.elapsed_s)}</td>
      <td class="py-3 px-4 text-zinc-500 font-mono text-[10px] hidden lg:table-cell truncate max-w-[320px]" title="${esc(j.last_line || 'Klik baris untuk log penuh')}">${esc((j.last_line || '-').slice(0,120))}</td>
      <td class="py-3 px-4 text-right" onclick="event.stopPropagation()">
        ${j.running ? `<button class="px-3 py-1 text-[10px] font-bold bg-red-500 text-white hover:bg-red-600 rounded-full transition shadow" onclick="stopTask(event,${i})" title="Stop job">STOP</button>` : '<span class="text-zinc-600 text-[10px]">—</span>'}
      </td>
    </tr>`).join('');
}

async function stopTask(ev, i) {
  ev.stopPropagation();
  const j = JOBS[i];
  if (!j || !j.running) return;
  if (!confirm(`Stop ${j.type} (${j.session === '-' ? j.detail : 'sesi ' + j.session})?`)) return;
  try {
    await fetch('/api/tasks/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: j.kind, session: j.session === '-' ? '' : j.session, clip: j.kind === 'render' ? (j.detail || '') : '' }) });
    refresh();
  } catch {}
}

let logPoll = null, logTarget = null;

function openLog(i) {
  const j = JOBS[i];
  if (!j) return;
  logTarget = { kind: j.kind, session: j.session === '-' ? '' : j.session, clip: j.kind === 'render' ? (j.detail || '') : '' };
  const label = j.type + (j.session !== '-' ? ` — sesi ${j.session}` : '') + (j.kind === 'render' && j.detail ? ` — ${j.detail}` : '');
  document.getElementById('logTitle').textContent = '📋 ' + label;
  document.getElementById('logBox').textContent = 'memuat…';
  Modal.show('logModal');
  loadLog();
  clearInterval(logPoll);
  logPoll = setInterval(() => { if (!document.querySelector('#logModal:not(.hidden)')) { clearInterval(logPoll); return; } loadLog(); }, 1000);
}

async function loadLog() {
  if (!logTarget) return;
  try {
    const q = new URLSearchParams({ kind: logTarget.kind, session: logTarget.session, clip: logTarget.clip });
    const j = await (await fetch('/api/tasks/log?' + q)).json();
    if (j.error) { document.getElementById('logBox').textContent = '❌ ' + j.error; return; }
    const box = document.getElementById('logBox');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = j.log || '(log kosong)';
    if (stick) box.scrollTop = box.scrollHeight;
    if (!j.running && !box.dataset.done) {
      box.dataset.done = '1';
      box.textContent += j.code === 0 ? '\n\n✅ Selesai.' : `\n\n❌ Gagal (exit ${j.code ?? '?'}).`;
    }
    if (j.running) delete box.dataset.done;
  } catch {}
}

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>

<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks — YT Short Clipper</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0d1117;font-size:.85rem}
.card{background:#161b22;border-color:#30363d}
.table{--bs-table-bg:transparent}
.badge-running{background:#ffc107;color:#000}
</style>
</head>
<body>
<nav class="navbar navbar-dark px-3 py-2" style="background:#010409;border-bottom:1px solid #30363d">
  <a class="btn btn-sm btn-outline-light" href="/">← Beranda</a>
  <span class="navbar-brand mb-0 fw-bold">📋 Tasks Aktif</span>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="text-muted small" id="whoami"></span>
    <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
  </div>
</nav>

<div class="container-fluid py-3">
<div class="card">
  <div class="card-header border-secondary py-2 d-flex justify-content-between align-items-center">
    <span class="fw-semibold">Semua job berjalan & terakhir</span>
    <span class="small text-muted">auto-refresh 3s · klik baris untuk lihat log</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead><tr class="small text-muted">
          <th class="ps-3">Job</th><th>Sesi</th><th>Detail</th><th>Status</th><th>Durasi</th><th></th>
        </tr></thead>
        <tbody id="taskBody"><tr><td colspan="6" class="text-muted small ps-3">memuat…</td></tr></tbody>
      </table>
    </div>
    <div id="empty" class="text-muted small text-center py-4" style="display:none">Tidak ada job aktif/terakhir.</div>
  </div>
</div>
</div>

<!-- modal log -->
<div class="modal fade" id="logModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header border-secondary py-2">
        <h6 class="modal-title" id="logTitle">Log</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-2">
        <pre id="logBox" class="bg-black text-light p-2 rounded small mb-0" style="max-height:70vh;overflow-y:auto;white-space:pre-wrap;overscroll-behavior:contain">memuat…</pre>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});</script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur = s => s == null ? '-' : (s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's');
const sessLink = sid => sid === '-' ? '<span class="text-muted">-</span>' : `<a href="/#${esc(sid)}">${esc(sid)}</a>`;
const statusBadge = j => j.running
  ? '<span class="badge badge-running">⏳ berjalan</span>'
  : (j.code === 0 ? '<span class="badge bg-success">✅ selesai</span>' : `<span class="badge bg-danger">❌ gagal (${j.code ?? '?'})</span>`);

let JOBS = [];

async function refresh() {
  let jobs = [];
  try { jobs = await (await fetch('/api/tasks')).json(); } catch {}
  if (!Array.isArray(jobs)) jobs = [];
  JOBS = jobs;
  document.getElementById('empty').style.display = jobs.length ? 'none' : 'block';
  document.getElementById('taskBody').innerHTML = jobs.map((j, i) => `
    <tr${j.running ? ' class="table-warning"' : ''} style="cursor:pointer" title="Klik untuk lihat log"
        onclick="openLog(${i})">
      <td class="ps-3 fw-semibold">${esc(j.type)}</td>
      <td onclick="event.stopPropagation()">${sessLink(j.session)}</td>
      <td class="small text-muted text-truncate" style="max-width:340px">${esc(j.detail)}</td>
      <td>${statusBadge(j)}</td>
      <td class="small">${dur(j.elapsed_s)}</td>
      <td class="pe-3 text-info small">log →</td>
    </tr>`).join('');
}

// ===== log viewer per job =====
const logModal = () => bootstrap.Modal.getOrCreateInstance('#logModal');
let logPoll = null, logTarget = null;

function openLog(i) {
  const j = JOBS[i];
  if (!j) return;
  logTarget = { kind: j.kind, session: j.session === '-' ? '' : j.session, clip: j.kind === 'render' ? (j.detail || '') : '' };
  const label = j.type + (j.session !== '-' ? ` — sesi ${j.session}` : '') + (j.kind === 'render' && j.detail ? ` — ${j.detail}` : '');
  document.getElementById('logTitle').textContent = '📋 ' + label;
  document.getElementById('logBox').textContent = 'memuat…';
  logModal().show();
  loadLog();
  clearInterval(logPoll);
  logPoll = setInterval(() => { if (!document.querySelector('#logModal.show')) { clearInterval(logPoll); return; } loadLog(); }, 1000);
}

async function loadLog() {
  if (!logTarget) return;
  try {
    const q = new URLSearchParams({ kind: logTarget.kind, session: logTarget.session, clip: logTarget.clip });
    const j = await (await fetch('/api/tasks/log?' + q)).json();
    if (j.error) { document.getElementById('logBox').textContent = '❌ ' + j.error; return; }
    const box = document.getElementById('logBox');
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = j.log || '(log kosong)';
    if (stick) box.scrollTop = box.scrollHeight;
    if (!j.running && !box.dataset.done) {
      box.dataset.done = '1';
      box.textContent += j.code === 0 ? '\n\n✅ Selesai.' : `\n\n❌ Gagal (exit ${j.code ?? '?'}).`;
    }
    if (j.running) delete box.dataset.done;
  } catch {}
}
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>

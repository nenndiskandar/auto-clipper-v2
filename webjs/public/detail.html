<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Klip — YT Short Clipper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        accent: '#facc15',
        surface: { 0: '#09090b', 1: '#121215', 2: '#18181b', 3: '#27272a' },
        zinc: { 450: '#8b8b96', 650: '#43434c' }
      }
    }
  }
}
</script>
<style>
body { background: #09090b; color: #f4f4f5; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#09090b]">

<!-- SIDEBAR -->
<aside class="w-full md:w-60 border-b md:border-b-0 md:border-r border-zinc-800 bg-zinc-950 flex flex-col shrink-0">
  <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
    <span class="font-bold text-sm tracking-wider text-accent">⚡ YT CLIPPER</span>
    <a href="/logout" class="text-xs text-zinc-400 hover:text-white transition md:hidden">Logout</a>
  </div>
  <div class="p-3 flex flex-row md:flex-col gap-1 overflow-x-auto md:overflow-x-visible">
    <a href="/" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition bg-zinc-900 text-white font-medium">🏠 Library</a>
    <a href="/create.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">＋ Create Clip</a>
    <a href="/tasks.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">📋 Tasks</a>
    <a href="/settings.html" class="flex items-center gap-2 px-3 py-2 text-xs rounded transition text-zinc-450 hover:text-white hover:bg-zinc-900/50">⚙️ Settings</a>
  </div>
  <div class="mt-auto p-4 border-t border-zinc-800 hidden md:flex items-center justify-between text-[11px]">
    <span class="text-zinc-500 truncate max-w-[120px]" id="whoami"></span>
    <a href="/logout" class="text-zinc-400 hover:text-white transition">Logout</a>
  </div>
</aside>

<!-- MAIN CONTENT WRAPPER -->
<div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
  <!-- MAIN CONTENT -->
  <main class="max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6 flex-1" id="mainContainer">
    <div class="text-center text-zinc-500 py-12 text-sm" id="loadingState">Memuat detail klip…</div>
    <div id="contentState" class="hidden space-y-6">
      
      <!-- VIDEO & METADATA -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- PLAYER -->
        <div class="lg:col-span-6 bg-black rounded-xl overflow-hidden border border-zinc-800 flex flex-col items-center justify-center shadow-lg relative min-h-[300px]">
          <video id="player" class="w-full max-h-[70vh] rounded-lg" controls playsinline></video>
        </div>

        <!-- METADATA CARD -->
        <div class="lg:col-span-6 space-y-4">
          <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">📋 Informasi Klip</h2>
              <div id="actionBtns" class="flex items-center gap-2"></div>
            </div>
            <table class="w-full text-xs text-zinc-300 border-collapse">
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500 w-1/3">Judul</td><td class="py-2 text-white font-semibold" id="m_title">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Waktu & Durasi</td><td class="py-2 text-white font-mono" id="m_time">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Hook Teks</td><td class="py-2 text-amber-300 font-medium" id="m_hook">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Skor Viral</td><td class="py-2 text-amber-400 font-bold" id="m_score">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Format</td><td class="py-2 text-white" id="m_aspect">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Ukuran File</td><td class="py-2 text-white font-mono" id="m_size">-</td></tr>
              <tr class="border-b border-zinc-800/80"><td class="py-2 font-medium text-zinc-500">Hashtags</td><td class="py-2 text-zinc-400 break-words" id="m_tags">-</td></tr>
              <tr><td class="py-2 font-medium text-zinc-500">Deskripsi</td><td class="py-2 text-zinc-300" id="m_desc">-</td></tr>
            </table>
          </div>

          <div id="sourceCard" class="text-xs bg-surface-1 border border-zinc-800 rounded-xl p-4 hidden">
            <span class="font-medium text-zinc-500 block mb-1">🔗 Sumber Video YouTube:</span>
            <a id="sourceUrl" class="text-accent hover:underline break-all font-mono" target="_blank" rel="noopener" href="#"></a>
          </div>
        </div>
      </div>

      <!-- AI TRANSKRIP & FILES -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 space-y-2">
          <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider block">💬 Transkrip Momen</label>
          <div id="m_transcript" class="bg-surface-2 border border-zinc-800 rounded-lg p-3 text-xs text-zinc-300 text-justify leading-relaxed max-h-48 overflow-y-auto"></div>
        </div>
        
        <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 space-y-2">
          <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider block">🤖 Analisis AI</label>
          <div id="m_analysis" class="bg-surface-2 border border-zinc-800 rounded-lg p-3 text-xs text-zinc-300 italic leading-relaxed max-h-48 overflow-y-auto"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script>
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});

const params = new URLSearchParams(window.location.search);
const sid = params.get('session');
const clipDir = params.get('clip');

function fmtSize(b) {
  if (!b) return '-';
  if (b >= 1024 * 1024) return (b / 1048576).toFixed(1) + ' MB';
  return Math.round(b / 1024) + ' KB';
}

async function loadDetail() {
  if (!sid || !clipDir) {
    document.getElementById('loadingState').textContent = 'Parameter sesi/klip tidak lengkap.';
    return;
  }
  try {
    const res = await fetch(`/api/sessions/${encodeURIComponent(sid)}/clip/${encodeURIComponent(clipDir)}`);
    const data = await res.json();
    if (!res.ok || !data.clip) {
      document.getElementById('loadingState').textContent = data.error || 'Klip tidak ditemukan.';
      return;
    }
    const s = data.session;
    const c = data.clip;

    document.getElementById('m_title').textContent = c.title || '-';
    document.getElementById('m_time').textContent = `${c.start_time || '-'} → ${c.end_time || '-'} (${c.duration || 0}s)`;
    document.getElementById('m_hook').textContent = c.hook_text || '-';
    document.getElementById('m_score').textContent = c.score != null ? `${c.score} / 10` : '-';
    document.getElementById('m_aspect').textContent = c.aspect || '-';
    document.getElementById('m_size').textContent = `${fmtSize(c.size_bytes)} (${c.file || '-'})`;
    document.getElementById('m_tags').textContent = c.hashtags || '-';
    document.getElementById('m_desc').textContent = c.desc || '-';
    document.getElementById('m_transcript').textContent = c.transcript || '-';
    document.getElementById('m_analysis').textContent = c.analysis || '-';

    const player = document.getElementById('player');
    player.src = `/video/${encodeURIComponent(s.id)}/${encodeURIComponent(c.dir)}/${encodeURIComponent(c.file)}`;
    player.poster = `/thumb/${encodeURIComponent(s.id)}/${encodeURIComponent(c.dir)}`;

    if (s.url) {
      document.getElementById('sourceCard').classList.remove('hidden');
      const uEl = document.getElementById('sourceUrl');
      uEl.href = s.url;
      uEl.textContent = s.url;
    }

    const dl = `/download/${encodeURIComponent(s.id)}/${encodeURIComponent(c.dir)}/${encodeURIComponent(c.file)}`;
    const sessionUrl = `/session.html?id=${encodeURIComponent(s.id)}`;
    document.getElementById('actionBtns').innerHTML = `
      <a href="${sessionUrl}" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white rounded text-xs font-semibold transition flex items-center gap-1">← Kembali ke Sesi</a>
      <a href="${dl}" download class="px-3 py-1.5 bg-accent hover:bg-yellow-400 text-black rounded text-xs font-semibold transition flex items-center gap-1 shadow">⬇ Download</a>
    `;

    document.getElementById('loadingState').classList.add('hidden');
    document.getElementById('contentState').classList.remove('hidden');
  } catch (e) {
    document.getElementById('loadingState').textContent = 'Gagal memuat data: ' + e;
  }
}

loadDetail();
</script>
</body>
</html>

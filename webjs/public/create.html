<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Clip — YT Short Clipper</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#0d1117;font-size:.85rem}
.form-control,.form-select{font-size:.8rem}
.form-check-label{white-space:normal;line-height:1.2}
.card{background:#161b22;border-color:#30363d}
pre.log{background:#000;color:#c9d1d9;font-size:.68rem;max-height:35vh;overflow-y:auto;overscroll-behavior:contain;white-space:pre-wrap}
.hl-item{border-color:#30363d!important}
.badge-score{font-size:.6rem}
</style>
</head>
<body>
<nav class="navbar navbar-dark px-3 py-2" style="background:#010409;border-bottom:1px solid #30363d">
  <a class="btn btn-sm btn-outline-light" href="/">← Beranda</a>
  <span class="navbar-brand mb-0 fw-bold">＋ Create Clip</span>
  <div class="ms-auto d-flex align-items-center gap-2">
    <span class="text-muted small" id="whoami"></span>
    <a class="btn btn-sm btn-outline-light" href="/logout">Logout</a>
  </div>
</nav>

<div class="container-fluid py-3">
<div class="row g-3">

<!-- ===== PANEL PARAMETER ===== -->
<div class="col-lg-5">
  <div class="card h-100">
    <div class="card-header border-secondary d-flex justify-content-between align-items-center py-2">
      <span class="fw-semibold">⚙️ Konfigurasi Aktif</span>
      <button class="btn btn-sm btn-warning" id="saveBtn" onclick="saveConfig()">💾 Simpan</button>
    </div>
    <div class="card-body">
      <div class="row g-2 mb-2">
        <div class="col-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_watermark"><label class="form-check-label" for="f_watermark">🖼️ Watermark</label></div></div>
        <div class="col-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_credit"><label class="form-check-label" for="f_credit">🏷️ Credit Watermark</label></div></div>
        <div class="col-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_hook"><label class="form-check-label" for="f_hook">🪝 Hook (TTS Intro)</label></div></div>
        <div class="col-6"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_captions"><label class="form-check-label" for="f_captions">💬 Subtitle (Caption)</label></div></div>
      </div>
      <hr class="border-secondary my-2">
      <div class="row g-2">
        <div class="col-6 col-md-4"><label class="form-label small mb-0">🎬 Jumlah Clips</label><input type="number" min="1" class="form-control" id="f_num_clips"></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">🎬 Resolusi</label><select class="form-select" id="f_resolution"><option>1080p</option><option>720p</option><option>480p</option><option>360p</option><option>auto</option></select></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">📐 Rasio</label><select class="form-select" id="f_aspect_ratio"><option>9:16</option><option>1:1</option><option>4:5</option><option>16:9</option></select></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">✏️ Gaya Subtitle</label><select class="form-select" id="f_subtitle_style"><option>pop</option><option>karaoke</option><option>bounce</option><option>animated</option><option>pop_bounce</option></select></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">⏱️ Sync Offset (s)</label><input type="number" step="0.1" class="form-control" id="f_sync_offset"></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">🖼️ Portrait Mode</label><select class="form-select" id="f_portrait_mode"><option>crop</option><option>blur</option></select></div>
        <div class="col-6 col-md-4"><label class="form-label small mb-0">🎯 Face Tracking</label><select class="form-select" id="f_face_tracking_mode"><option>opencv</option><option>mediapipe</option></select></div>
        <div class="col-6 col-md-4"><div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" id="f_smooth_follow"><label class="form-check-label" for="f_smooth_follow">🎯 Smooth Follow</label></div></div>
        <div class="col-6 col-md-4"><div class="form-check form-switch mt-4"><input class="form-check-input" type="checkbox" id="f_gpu"><label class="form-check-label" for="f_gpu">⚡️ GPU Accel</label></div></div>
      </div>
      <details class="mt-2"><summary class="text-info small">🎯 Lanjutan face tracking</summary>
        <div class="row g-2 mt-1">
          <div class="col-6 col-md-4"><label class="form-label small mb-0">Pan Speed Limit</label><input type="number" step="0.1" class="form-control" id="f_pan_speed_limit"></div>
          <div class="col-6 col-md-4"><label class="form-label small mb-0">Center Weight</label><input type="number" step="0.05" class="form-control" id="f_center_weight"></div>
          <div class="col-6 col-md-4"><label class="form-label small mb-0">Switch Threshold</label><input type="number" step="0.05" class="form-control" id="f_switch_threshold"></div>
          <div class="col-6 col-md-6"><label class="form-label small mb-0">Min Shot Duration</label><input type="number" step="1" class="form-control" id="f_min_shot_duration"></div>
          <div class="col-6 col-md-6"><label class="form-label small mb-0">Lip Activity</label><input type="number" step="0.01" class="form-control" id="f_lip_activity"></div>
        </div>
      </details>
      <details class="mt-2" open><summary class="text-info small">🤖 AI & Transkripsi</summary>
        <div class="row g-2 mt-1">
          <div class="col-12 col-md-6"><label class="form-label small mb-0">🤖 HF Model</label><input type="text" class="form-control" id="f_hf_model" placeholder="AUTO"></div>
          <div class="col-12 col-md-6"><label class="form-label small mb-0">🌐 Server</label><input type="text" class="form-control" id="f_server_url" placeholder="http://localhost:20128/v1"></div>
          <div class="col-12"><label class="form-label small mb-0">🎙 Faster-Whisper <span id="fwBadge" class="small"></span></label>
            <select class="form-select" id="f_fw_model"><option value="tiny">tiny</option><option value="base">base</option><option value="small">small</option><option value="medium">medium</option><option value="large-v3">large-v3</option></select></div>
        </div>
      </details>
      <div id="saveMsg" class="small mt-2"></div>
    </div>
    <div class="card-footer border-secondary py-2">
      <span class="fw-semibold small">🧰 Biner:</span>
      <ul id="binList" class="small mb-0 ps-3"></ul>
    </div>
  </div>
</div>

<!-- ===== WORKFLOW ===== -->
<div class="col-lg-7">
  <div class="card h-100">
    <div class="card-header border-secondary py-2"><span class="fw-semibold">🎬 Workflow</span></div>
    <div class="card-body" id="wfArea">
      <label class="form-label small">URL video (YouTube, TikTok, IG, X, dll)</label>
      <div class="d-flex gap-2 align-items-end mb-3">
        <input id="wUrl" class="form-control" placeholder="https://...">
        <button class="btn btn-warning flex-shrink-0" id="startBtn" onclick="startCreate()">🔍 Analisis Highlight</button>
      </div>
      <div id="wStatus"></div>
      <pre class="log d-none mt-2" id="wLog"></pre>
    </div>
  </div>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ===== load config + binaries =====
async function loadConfig() {
  try {
    const c = await (await fetch('/api/config')).json();
    const setCh = (id, v) => $('#' + id).checked = !!v;
    setCh('f_watermark', c.watermark); setCh('f_credit', c.credit);
    setCh('f_hook', c.hook); setCh('f_captions', c.captions);
    setCh('f_smooth_follow', c.smooth_follow); setCh('f_gpu', c.gpu);
    $('#f_num_clips').value = c.num_clips;
    $('#f_resolution').value = c.resolution;
    $('#f_aspect_ratio').value = c.aspect_ratio;
    $('#f_subtitle_style').value = c.subtitle_style;
    $('#f_sync_offset').value = c.sync_offset;
    $('#f_portrait_mode').value = c.portrait_mode;
    $('#f_face_tracking_mode').value = c.face_tracking_mode;
    $('#f_pan_speed_limit').value = c.pan_speed_limit;
    $('#f_center_weight').value = c.center_weight;
    $('#f_switch_threshold').value = c.switch_threshold;
    $('#f_min_shot_duration').value = c.min_shot_duration;
    $('#f_lip_activity').value = c.lip_activity;
    $('#f_hf_model').value = c.hf_model || 'AUTO';
    $('#f_server_url').value = c.server_url || '';
    $('#f_fw_model').value = c.fw_model || 'small';
    $('#fwBadge').textContent = c.fw_installed ? '🟢 terunduh' : '🔴 belum ada';
  } catch { $('#saveMsg').innerHTML = '<span class="text-danger">Gagal memuat konfigurasi.</span>'; }
}

function collectConfig() {
  return {
    watermark: $('#f_watermark').checked,
    credit: $('#f_credit').checked,
    hook: $('#f_hook').checked,
    captions: $('#f_captions').checked,
    gpu: $('#f_gpu').checked,
    smooth_follow: $('#f_smooth_follow').checked,
    num_clips: parseFloat($('#f_num_clips').value),
    resolution: $('#f_resolution').value,
    aspect_ratio: $('#f_aspect_ratio').value,
    subtitle_style: $('#f_subtitle_style').value,
    sync_offset: parseFloat($('#f_sync_offset').value),
    portrait_mode: $('#f_portrait_mode').value,
    face_tracking_mode: $('#f_face_tracking_mode').value,
    pan_speed_limit: parseFloat($('#f_pan_speed_limit').value),
    center_weight: parseFloat($('#f_center_weight').value),
    switch_threshold: parseFloat($('#f_switch_threshold').value),
    min_shot_duration: parseFloat($('#f_min_shot_duration').value),
    lip_activity: parseFloat($('#f_lip_activity').value),
    hf_model: $('#f_hf_model').value.trim(),
    server_url: $('#f_server_url').value.trim(),
    fw_model: $('#f_fw_model').value.trim(),
  };
}

async function saveConfig() {
  const msg = $('#saveMsg');
  $('#saveBtn').disabled = true;
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(collectConfig()) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    msg.innerHTML = '<span class="text-success">✅ Tersimpan ke config.json.</span>';
  } catch (e) { msg.innerHTML = `<span class="text-danger">❌ ${esc(String(e))}</span>`; }
  $('#saveBtn').disabled = false;
  setTimeout(() => { msg.textContent = ''; }, 4000);
}

async function loadBinaries() {
  try {
    const bins = await (await fetch('/api/binaries')).json();
    $('#binList').innerHTML = bins.map(b =>
      `<li>${b.ok ? '✅' : '❌'} ${esc(b.name)} — ${b.ok ? esc(b.detail) : '<span class="text-danger">' + esc(b.detail) + '</span>'}</li>`).join('');
  } catch {}
}

// ===== phase 1 =====
let PICK_SESSION = null;

async function startCreate() {
  const url = $('#wUrl').value.trim();
  if (!/^https?:\/\//.test(url)) { alert('Isi URL video dulu'); return; }
  const st = $('#wStatus'), logBox = $('#wLog');
  $('#startBtn').disabled = true;
  logBox.classList.remove('d-none');
  st.innerHTML = '<div class="alert alert-info py-2 small mb-0 d-flex justify-content-between align-items-center gap-2"><span>⏳ Mengunduh subtitle & analisis AI… <span id="wElapsed"></span></span><button class="btn btn-sm btn-danger py-0 px-2 flex-shrink-0" id="wCancelBtn" onclick="cancelCreate()">⏹ Stop</button></div>';
  try {
    const r = await fetch('/api/create', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ url }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) {
    st.innerHTML = `<div class="alert alert-danger py-2 small">❌ ${esc(String(e))}</div>`;
    $('#startBtn').disabled = false;
    return;
  }
  const t0 = Date.now();
  const poll = setInterval(async () => {
    try {
      const j = await (await fetch('/api/create/status')).json();
      const stick = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 60;
      logBox.textContent = j.log || '';
      if (stick) logBox.scrollTop = logBox.scrollHeight;
      const el = document.getElementById('wElapsed');
      if (el) el.textContent = `(${Math.round((Date.now()-t0)/1000)}s)`;
      if (!j.running) {
        clearInterval(poll);
        if (j.code === 0 && j.result && j.result.ok) {
          st.innerHTML = `<div class="alert alert-success py-2 small">✅ ${j.result.count} highlight ditemukan — pilih yang mau dirender:</div>`;
          await showPicker(j.result.session_dir);
        } else if (window._ph1Cancel) {
          window._ph1Cancel = false;
          st.insertAdjacentHTML('beforeend', '<div class="alert alert-secondary py-2 small">⏹ Analisis dibatalkan.</div>');
          $('#startBtn').disabled = false;
        } else {
          const err = (j.result && j.result.error) || ('exit code ' + j.code);
          st.insertAdjacentHTML('beforeend', `<div class="alert alert-danger py-2 small" style="white-space:pre-wrap">❌ Gagal: ${esc(err)}</div>`);
          $('#startBtn').disabled = false;
        }
      }
    } catch {}
  }, 2500);
}

async function showPicker(sessionDir) {
  PICK_SESSION = sessionDir.split('/').pop();
  let hls = [];
  try { hls = await (await fetch(`/api/highlights/${encodeURIComponent(PICK_SESSION)}`)).json(); } catch {}
  if (!Array.isArray(hls) || !hls.length) {
    $('#wStatus').insertAdjacentHTML('beforeend', '<div class="alert alert-warning py-2 small">Highlight tidak terbaca.</div>');
    return;
  }
  const rows = hls.map(h => `
    <label class="list-group-item bg-transparent hl-item d-flex align-items-start gap-2 py-1">
      <input class="form-check-input mt-1 hl-check flex-shrink-0" type="checkbox" value="${h.i}" checked>
      <span class="flex-grow-1">
        <span class="fw-semibold">${esc(h.title)}</span>
        ${h.score != null ? `<span class="badge bg-warning text-dark badge-score ms-1">⭐${h.score}</span>` : ''}
        <br><span class="text-muted" style="font-size:.7rem">${esc(h.start)} → ${esc(h.end)} · ${h.duration}s</span>
      </span>
    </label>`).join('');
  $('#wfArea').innerHTML = `
    <div class="d-flex justify-content-between align-items-center mb-1">
      <span class="small text-muted">Sesi: <code>${esc(PICK_SESSION)}</code> · ${hls.length} highlight</span>
      <button class="btn btn-sm btn-outline-secondary py-0" onclick="location.reload()">← Ulang</button>
    </div>
    <div class="list-group list-group-flush border rounded mb-2" style="max-height:38vh;overflow:auto">${rows}</div>
    <div class="text-end mb-2"><a href="#" class="small text-info" onclick="toggleAll(this);return false">pilih semua / none</a></div>
    <button class="btn btn-warning w-100 mb-2" id="procBtn" onclick="startProcess()">🎬 Render Klip Terpilih</button>
    <div id="pStatus"></div>
    <pre class="log d-none mt-2" id="pLog"></pre>`;
}

function toggleAll(el) {
  const boxes = [...document.querySelectorAll('.hl-check')];
  const anyOff = boxes.some(b => !b.checked);
  boxes.forEach(b => b.checked = anyOff);
}

// ===== phase 2 =====
async function startProcess() {
  const sel = [...document.querySelectorAll('.hl-check:checked')].map(b => parseInt(b.value));
  if (!sel.length) { alert('Pilih minimal 1 highlight'); return; }
  // hook/caption ikut nilai panel kiri (satu sumber)
  const hookOn = $('#f_hook').checked, capsOn = $('#f_captions').checked;
  const proc = $('#pStatus'), logBox = $('#pLog');
  $('#procBtn').disabled = true;
  logBox.classList.remove('d-none');
  try {
    const r = await fetch(`/api/process/${encodeURIComponent(PICK_SESSION)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ selected: sel, hook: hookOn, captions: capsOn }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  } catch (e) {
    proc.innerHTML = `<div class="alert alert-danger py-2 small">❌ ${esc(String(e))}</div>`;
    $('#procBtn').disabled = false;
    return;
  }
  proc.innerHTML = '<div class="alert alert-info py-2 small mb-0 d-flex justify-content-between align-items-center gap-2"><span>⏳ Download section & render… <span id="pElapsed"></span></span><button class="btn btn-sm btn-danger py-0 px-2 flex-shrink-0" id="pCancelBtn" onclick="cancelProcess()">⏹ Stop</button></div>';
  const t0 = Date.now();
  const poll = setInterval(async () => {
    try {
      const j = await (await fetch(`/api/process/status/${encodeURIComponent(PICK_SESSION)}`)).json();
      const stick = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 60;
      logBox.textContent = j.log || '';
      if (stick) logBox.scrollTop = logBox.scrollHeight;
      const el = document.getElementById('pElapsed');
      if (el) el.textContent = `(${Math.round((Date.now()-t0)/1000)}s)`;
      if (!j.running) {
        clearInterval(poll);
        if (j.code === 0) {
          proc.innerHTML = '<div class="alert alert-success py-2 small">✅ Render selesai! <a href="/" class="alert-link">Lihat hasil di beranda →</a></div>';
        } else if (window._ph2Cancel) {
          window._ph2Cancel = false;
          proc.insertAdjacentHTML('beforeend', '<div class="alert alert-secondary py-2 small">⏹ Proses dibatalkan.</div>');
          $('#procBtn').disabled = false;
        } else {
          proc.innerHTML = `<div class="alert alert-danger py-2 small">❌ Process gagal (exit ${j.code ?? '?'}) — lihat log.</div>`;
          $('#procBtn').disabled = false;
        }
      }
    } catch {}
  }, 2500);
}

async function cancelCreate() {
  window._ph1Cancel = true;
  const b = document.getElementById('wCancelBtn');
  if (b) { b.disabled = true; b.textContent = '⏳ menghentikan…'; }
  try { await fetch('/api/create/cancel', { method: 'POST' }); } catch {}
}

async function cancelProcess() {
  window._ph2Cancel = true;
  const b = document.getElementById('pCancelBtn');
  if (b) { b.disabled = true; b.textContent = '⏳ menghentikan…'; }
  try { await fetch(`/api/process/cancel/${encodeURIComponent(PICK_SESSION)}`, { method: 'POST' }); } catch {}
}

loadConfig();
loadBinaries();
</script>
</body>
</html>

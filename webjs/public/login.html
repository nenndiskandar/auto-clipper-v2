<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto Clipper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: {
    surface: { 0:'#09090b', 1:'#18181b', 2:'#27272a', 3:'#3f3f46' },
    accent: '#facc15',
  }}}
}
</script>
<style>
body{background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="bg-surface-1 border border-zinc-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center space-y-6">
  <div>
    <h1 class="text-lg font-bold text-white tracking-wide">🎬 Iskan Clip</h1>
    <p class="text-[11px] text-zinc-500 uppercase tracking-wider mt-1">Panel admin — akses terbatas</p>
  </div>

  <form id="login" class="space-y-4">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Password"
      class="w-full bg-surface-2/40 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-accent">
    <button type="submit"
      class="w-full bg-accent text-black font-semibold rounded-xl py-3 text-sm hover:opacity-90 transition">
      Masuk
    </button>
  </form>

  <div class="space-y-1">
    <p class="text-[11px] text-zinc-400">Masukkan password admin.</p>
    <p id="err" class="text-xs text-red-400 hidden mt-2"></p>
  </div>
</div>

<script>
document.getElementById('login').addEventListener('submit', e => {
  e.preventDefault();
  const pass = document.getElementById('pass').value;
  fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ password: pass }),
  }).then(r => r.json()).then(d => {
    if (d.ok) location.href = '/';
    else {
      const el = document.getElementById('err');
      el.textContent = d.error || 'Login gagal';
      el.classList.remove('hidden');
    }
  }).catch(() => {
    const el = document.getElementById('err');
    el.textContent = 'Gagal terhubung ke server';
    el.classList.remove('hidden');
  });
});
</script>
</body>
</html>

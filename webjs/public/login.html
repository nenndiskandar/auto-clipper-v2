<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Iskan Clip</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  html,body{height:100%}
  .card{border:0;border-radius:1rem}
  #err{display:none}
</style>
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center">
<div class="card shadow p-4 p-md-5 text-center" style="max-width:26rem;width:92%">
  <h4 class="mb-1">🎬 Iskan Clip</h4>
  <p class="text-secondary small mb-4">Panel admin — akses terbatas</p>
  <div id="widget">
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="iskanclip_bot" data-size="large" data-radius="8"
      data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
  </div>
  <p class="text-secondary small mt-4 mb-0">Login pakai akun Telegram pemilik.</p>
  <p id="err" class="small text-danger mt-2 mb-0"></p>
</div>
<script>
function onTelegramAuth(user) {
  fetch('/api/auth/telegram', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(user),
  }).then(r => r.json()).then(d => {
    if (d.ok) location.href = '/';
    else {
      const e = document.getElementById('err');
      e.textContent = d.error || 'Login gagal';
      e.style.display = 'block';
    }
  }).catch(() => {
    const e = document.getElementById('err');
    e.textContent = 'Gagal terhubung ke server';
    e.style.display = 'block';
  });
}
</script>
</body>
</html>

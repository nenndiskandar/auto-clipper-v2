<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — YT Short Clipper</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: {
    surface: { 0:'#09090b', 1:'#18181b', 2:'#27272a', 3:'#3f3f46' },
    accent: '#facc15',
  }}}
}
</script>
<style>
body{background:#09090b;color:#fafafa;font-family:system-ui,-apple-system,sans-serif}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:3px}
.tpl-btn{border:1px solid #27272a;border-radius:.375rem;padding:.35rem .6rem;cursor:pointer;transition:all .15s;font-size:.75rem}
.tpl-btn:hover{border-color:#facc15;background:#18181b}
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- NAV -->
<nav class="sticky top-0 z-50 flex items-center justify-between px-4 py-2.5 border-b border-zinc-800 bg-surface-0/80 backdrop-blur-md">
  <div class="flex items-center gap-3">
    <a href="/" class="text-sm text-zinc-400 hover:text-white transition">← Beranda</a>
    <span class="font-semibold text-sm tracking-wide text-accent">⚙️ Settings</span>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-xs text-zinc-500" id="whoami"></span>
    <a href="/logout" class="text-xs text-zinc-400 hover:text-white transition">Logout</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<main class="flex-1 max-w-6xl w-full mx-auto p-4 space-y-4">
  
  <!-- TEMPLATES -->
  <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-md">
    <div class="mb-3">
      <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">⚡ Template Otomatis</h2>
      <p class="text-[10px] text-zinc-500">Klik sesuai tipe video untuk memuat preset config, lalu klik 💾 Simpan Semua</p>
    </div>
    <div class="flex flex-wrap gap-2" id="tplBar"></div>
    <div id="tplMsg" class="text-xs mt-3 text-emerald-400 hidden"></div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    
    <!-- AI & ANALISIS -->
    <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-md space-y-3">
      <h3 class="text-xs font-semibold text-zinc-450 uppercase tracking-wider pb-2 border-b border-zinc-800">🤖 AI & Analisis</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">Model Analisis</label>
          <input id="s_core_model" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">TTS Model</label>
          <input id="s_tts_model" placeholder="tts-1" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Temperature</label>
          <input type="number" step="0.05" min="0" max="2" id="s_temperature" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">HF Model</label>
          <input id="s_hf_model" placeholder="AUTO" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">Server URL (OpenAI-compatible)</label>
          <input id="s_server_url" placeholder="http://localhost:20128/v1" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">HF API Key <span class="text-zinc-500 font-mono text-[9px]" id="keyState"></span></label>
          <input type="password" id="s_hf_api_key" placeholder="(tidak diubah)" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">Bahasa Subtitle</label>
          <input id="s_subtitle_language" placeholder="id" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">System message (highlight finder)</label>
          <textarea rows="3" id="s_hf_system_message" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"></textarea>
        </div>
        <div class="col-span-2">
          <label class="text-[10px] text-zinc-500 block mb-0.5">🎙 Faster-Whisper <span id="fwBadge" class="text-[9px] px-1 py-0.5 rounded font-mono ml-1"></span></label>
          <select id="s_fw_model" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option value="tiny">tiny</option><option value="base">base</option><option value="small">small</option><option value="medium">medium</option><option value="large-v3">large-v3</option></select>
        </div>
      </div>
    </div>

    <!-- RENDER & TRACKING -->
    <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-md space-y-3">
      <h3 class="text-xs font-semibold text-zinc-450 uppercase tracking-wider pb-2 border-b border-zinc-800">🎬 Render & Tracking</h3>
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2 grid grid-cols-2 gap-1.5 bg-surface-2/40 p-2.5 rounded-lg border border-zinc-800">
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer py-1"><input type="checkbox" id="s_hook" class="w-3.5 h-3.5 accent-[#facc15]"> 🪝 Hook</label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer py-1"><input type="checkbox" id="s_captions" class="w-3.5 h-3.5 accent-[#facc15]"> 💬 Subtitle</label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer py-1"><input type="checkbox" id="s_gpu" class="w-3.5 h-3.5 accent-[#facc15]"> ⚡ GPU</label>
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer py-1"><input type="checkbox" id="s_smooth_follow" class="w-3.5 h-3.5 accent-[#facc15]"> Smooth Follow</label>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Jumlah Klip</label>
          <input type="number" min="1" id="s_num_clips" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Resolusi</label>
          <select id="s_resolution" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option>1080p</option><option>720p</option><option>480p</option><option>360p</option><option>auto</option></select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Rasio</label>
          <select id="s_aspect_ratio" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option>9:16</option><option>1:1</option><option>4:5</option><option>16:9</option></select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Gaya Subtitle</label>
          <select id="s_subtitle_style" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option>pop</option><option>karaoke</option><option>bounce</option><option>animated</option><option>pop_bounce</option></select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Sync Offset (s)</label>
          <input type="number" step="0.1" id="s_sync_offset" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Portrait Mode</label>
          <select id="s_portrait_mode" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option>crop</option><option>blur</option></select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Face Tracking</label>
          <select id="s_face_tracking_mode" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent"><option>opencv</option><option>mediapipe</option></select>
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Pan Speed Limit</label>
          <input type="number" step="0.1" id="s_pan_speed_limit" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Center Weight</label>
          <input type="number" step="0.05" id="s_center_weight" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Switch Threshold</label>
          <input type="number" step="0.05" id="s_switch_threshold" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Min Shot Duration</label>
          <input type="number" step="1" id="s_min_shot_duration" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
        <div>
          <label class="text-[10px] text-zinc-500 block mb-0.5">Lip Activity</label>
          <input type="number" step="0.01" id="s_lip_activity" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
        </div>
      </div>
    </div>

    <!-- WATERMARK -->
    <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-md space-y-3">
      <h3 class="text-xs font-semibold text-zinc-450 uppercase tracking-wider pb-2 border-b border-zinc-800">🖼️ Watermark</h3>
      <div class="space-y-3">
        <div class="flex items-center gap-3 bg-surface-2/45 p-3 rounded-lg border border-zinc-800 flex-wrap justify-between">
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer"><input type="checkbox" id="s_wm_on" class="w-3.5 h-3.5 accent-[#facc15]"> Aktif</label>
          <div class="flex items-center gap-2 flex-1 min-w-[200px] justify-end">
            <input type="file" accept=".png,.jpg,.jpeg" id="wmFile" class="text-xs text-zinc-400 bg-surface-2 border border-zinc-700 rounded px-2 py-1 max-w-[200px] focus:outline-none">
            <button onclick="uploadWm()" class="px-3 py-1 bg-accent text-black text-xs font-medium rounded hover:bg-yellow-400 transition whitespace-nowrap">Upload</button>
          </div>
        </div>
        <div id="wmMsg" class="text-[11px] text-zinc-500 font-mono italic"></div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] text-zinc-500 block mb-0.5">Posisi X (0-1)</label>
            <input type="number" step="0.01" min="0" max="1" id="s_wm_x" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 block mb-0.5">Posisi Y (0-1)</label>
            <input type="number" step="0.01" min="0" max="1" id="s_wm_y" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 block mb-0.5">Scale (0-1)</label>
            <input type="number" step="0.01" min="0.01" max="1" id="s_wm_scale" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
          </div>
          <div>
            <label class="text-[10px] text-zinc-500 block mb-0.5">Opacity (0-1)</label>
            <input type="number" step="0.05" min="0" max="1" id="s_wm_op" class="w-full bg-surface-2 border border-zinc-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
          </div>
        </div>
      </div>
    </div>

    <!-- CREDIT & HOOK STYLE -->
    <div class="bg-surface-1 border border-zinc-800 rounded-xl p-4 shadow-md space-y-3">
      <h3 class="text-xs font-semibold text-zinc-450 uppercase tracking-wider pb-2 border-b border-zinc-800">🏷️ Credit Watermark & 🪝 Hook Style</h3>
      <div class="space-y-3">
        <div class="p-3 bg-surface-2/30 border border-zinc-800/80 rounded-lg space-y-2.5">
          <label class="flex items-center gap-2 text-xs text-zinc-300 cursor-pointer"><input type="checkbox" id="s_cw_on" class="w-3.5 h-3.5 accent-[#facc15]"> Credit Watermark Aktif</label>
          <div class="grid grid-cols-4 gap-2">
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Pos X</label>
              <input type="number" step="0.01" min="0" max="1" id="s_cw_x" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Pos Y</label>
              <input type="number" step="0.01" min="0" max="1" id="s_cw_y" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Size</label>
              <input type="number" step="0.005" min="0.001" id="s_cw_size" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Opacity</label>
              <input type="number" step="0.05" min="0" max="1" id="s_cw_op" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
          </div>
        </div>

        <div class="p-3 bg-surface-2/30 border border-zinc-800/80 rounded-lg space-y-2.5">
          <div class="text-[10px] text-zinc-400 font-semibold uppercase tracking-wide">Hook Style Config</div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Font Size</label>
              <input type="number" step="0.005" min="0.01" id="s_hs_size" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Corner Radius</label>
              <input type="number" step="1" min="0" id="s_hs_radius" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Glitch Effect</label>
              <label class="flex items-center h-8 cursor-pointer"><input type="checkbox" id="s_hs_glitch" class="w-3.5 h-3.5 accent-[#facc15]"></label>
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Pos X</label>
              <input type="number" step="0.01" min="0" max="1" id="s_hs_x" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Pos Y</label>
              <input type="number" step="0.01" min="0" max="1" id="s_hs_y" class="w-full bg-surface-2 border border-zinc-700 rounded px-1.5 py-1 text-xs text-white focus:outline-none focus:border-accent">
            </div>
            <div>
              <label class="text-[9px] text-zinc-500 block mb-0.5">Font Color</label>
              <input type="color" id="s_hs_fc" class="w-full h-8 bg-surface-2 border border-zinc-700 rounded p-0.5 cursor-pointer">
            </div>
            <div class="col-span-3">
              <label class="text-[9px] text-zinc-500 block mb-0.5">BG Color</label>
              <input type="color" id="s_hs_bc" class="w-full h-8 bg-surface-2 border border-zinc-700 rounded p-0.5 cursor-pointer">
            </div>
          </div>
        </div>

        <div class="pt-1.5">
          <label class="text-[10px] text-zinc-500 block mb-1.5 font-semibold uppercase tracking-wider">🔥 Template Hook Style Viral</label>
          <div class="flex flex-wrap gap-1.5" id="hsBar"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="sticky bottom-0 z-10 bg-surface-0 border-t border-zinc-800 p-4 flex items-center gap-3 justify-end rounded-xl shadow-lg mt-2">
    <span id="msg" class="text-xs"></span>
    <button id="saveBtn" onclick="saveAll()" class="px-6 py-2 bg-accent text-black font-semibold rounded hover:bg-yellow-400 transition shadow">💾 Simpan Semua</button>
  </div>
  
</main>

<script>
fetch('/api/me').then(r=>r.json()).then(d=>{if(d.name)document.getElementById('whoami').textContent='👤 '+d.name;});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(v)) ? null : parseFloat(v);

let C = {};
async function load() {
  try {
    C = await (await fetch('/api/config')).json();
    const v = (id, val) => { if (val !== undefined && val !== null) $(id).value = val; };
    $('#s_hook').checked = !!C.hook; $('#s_captions').checked = !!C.captions;
    $('#s_gpu').checked = !!C.gpu; $('#s_smooth_follow').checked = !!C.smooth_follow;
    v('#s_num_clips', C.num_clips); v('#s_resolution', C.resolution); v('#s_aspect_ratio', C.aspect_ratio);
    v('#s_subtitle_style', C.subtitle_style); v('#s_sync_offset', C.sync_offset);
    v('#s_portrait_mode', C.portrait_mode); v('#s_face_tracking_mode', C.face_tracking_mode);
    v('#s_pan_speed_limit', C.pan_speed_limit); v('#s_center_weight', C.center_weight);
    v('#s_switch_threshold', C.switch_threshold); v('#s_min_shot_duration', C.min_shot_duration);
    v('#s_lip_activity', C.lip_activity);
    v('#s_core_model', C.core_model); v('#s_tts_model', C.tts_model); v('#s_temperature', C.temperature);
    v('#s_hf_model', C.hf_model); v('#s_server_url', C.server_url);
    v('#s_subtitle_language', C.subtitle_language);
    $('#s_hf_system_message').value = C.hf_system_message || '';
    $('#keyState').textContent = C.hf_api_key_set ? '(tersimpan)' : '(belum ada)';
    v('#s_fw_model', C.fw_model || 'small');
    
    const fwBadge = $('#fwBadge');
    if (C.fw_installed) {
      fwBadge.textContent = '🟢 Aktif';
      fwBadge.className = 'text-[9px] px-1.5 py-0.5 rounded font-mono ml-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
    } else {
      fwBadge.textContent = '🔴 Belum Terunduh';
      fwBadge.className = 'text-[9px] px-1.5 py-0.5 rounded font-mono ml-1 bg-red-500/10 text-red-400 border border-red-500/20';
    }
    
    // watermark
    const wm = C.wm || {}, cw = C.cw || {}, hs = C.hookstyle || {};
    $('#s_wm_on').checked = !!C.watermark;
    v('#s_wm_x', wm.position_x); v('#s_wm_y', wm.position_y); v('#s_wm_scale', wm.scale); v('#s_wm_op', wm.opacity);
    $('#wmMsg').textContent = wm.image_path ? ('File: ' + wm.image_path) : '';
    $('#s_cw_on').checked = !!C.credit;
    v('#s_cw_x', cw.position_x); v('#s_cw_y', cw.position_y); v('#s_cw_size', cw.size); v('#s_cw_op', cw.opacity);
    v('#s_hs_size', hs.font_size); v('#s_hs_radius', hs.corner_radius);
    v('#s_hs_x', hs.position_x); v('#s_hs_y', hs.position_y);
    if (hs.font_color) $('#s_hs_fc').value = hs.font_color;
    if (hs.bg_color) $('#s_hs_bc').value = hs.bg_color;
    $('#s_hs_glitch').checked = !!hs.glitch;
  } catch { msg('❌ Gagal memuat konfigurasi.', false); }
}

function collect() {
  return {
    hook: $('#s_hook').checked, captions: $('#s_captions').checked,
    gpu: $('#s_gpu').checked, smooth_follow: $('#s_smooth_follow').checked,

function msg(t, ok) {
  const m = $('#msg');
  m.textContent = t;
  m.className = 'text-xs ' + (ok ? 'text-emerald-400' : 'text-red-400');
  setTimeout(() => m.textContent = '', 5000);
}

async function saveAll() {
  const body = collect();
  const key = $('#s_hf_api_key').value.trim();
  if (key) body.hf_api_key = key;
  $('#saveBtn').disabled = true;
  try {
    const r = await fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    if (key) { $('#s_hf_api_key').value = ''; $('#keyState').textContent = '(tersimpan)'; }
    msg('✅ Tersimpan ke config.json.', true);
  } catch (e) { msg('❌ ' + e, false); }
  $('#saveBtn').disabled = false;
}

async function uploadWm() {
  const f = $('#wmFile').files[0];
  if (!f) { msg('Pilih file gambar dulu.', false); return; }
  const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
  try {
    const r = await fetch('/api/upload/watermark', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ name: f.name, data: b64 }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    $('#wmMsg').textContent = 'File: ' + j.path;
    msg('✅ Watermark terupload & dipasang.', true);
  } catch (e) { msg('❌ Upload gagal: ' + e, false); }
}
